apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-kubernetes-showcase
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abla86/azure-kubernetes-showcase.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: showcase
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
