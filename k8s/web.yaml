apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-web
  namespace: showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showcase-web
  template:
    metadata:
      labels:
        app: showcase-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: azure-kubernetes-showcase-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-web
  namespace: showcase
spec:
  type: LoadBalancer
  selector:
    app: showcase-web
  ports:
    - port: 80
      targetPort: 8080
