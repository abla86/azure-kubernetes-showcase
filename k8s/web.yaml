apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-web
  namespace: showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showcase-web
  template:
    metadata:
      labels:
        app: showcase-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: azure-kubernetes-showcase-web:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-web
  namespace: showcase
spec:
  type: ClusterIP
  selector:
    app: showcase-web
  ports:
    - port: 80
      targetPort: 8080
