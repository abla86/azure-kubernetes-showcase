apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-web
  namespace: showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showcase-web
  template:
    metadata:
      labels:
        app: showcase-web
    spec:
      containers:
        - name: web
          image: azure-kubernetes-showcase-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-web
  namespace: showcase
spec:
  type: LoadBalancer
  selector:
    app: showcase-web
  ports:
    - port: 80
      targetPort: 80
