apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-hub-api
  namespace: showcase
  labels:
    app: community-hub-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-hub-api
  template:
    metadata:
      labels:
        app: community-hub-api
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: acrshowcase.azurecr.io/community-hub-api:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1654
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: community-hub-service
  namespace: showcase
spec:
  selector:
    app: community-hub-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
