apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-radar
  namespace: showcase
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Internal image tag pinning used for demo"
    checkov.io/skip2: "CKV2_K8S_6=Default cluster network policy applied globally"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-radar
  template:
    metadata:
      labels:
        app: security-radar
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: acrshowcasedev.azurecr.io/security-radar:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: security-radar-service
  namespace: showcase
spec:
  selector:
    app: security-radar
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
