apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: showcase-api
  namespace: showcase
spec:
  podSelector:
    matchLabels:
      app: showcase-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: showcase-web
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
