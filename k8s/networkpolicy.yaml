apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: showcase-web
  namespace: showcase
spec:
  podSelector:
    matchLabels:
      app: showcase-web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alb-showcase-system
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: showcase-api
        - podSelector:
            matchLabels:
