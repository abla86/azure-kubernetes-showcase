apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security-radar-route
  namespace: showcase
spec:
  parentRefs:
    - name: showcase-gateway
  rules:
    - matches:
        - path: {type: PathPrefix, value: /radar}
      backendRefs:
        - name: security-radar-service
          port: 80
