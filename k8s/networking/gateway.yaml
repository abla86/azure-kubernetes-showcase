apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: showcase-gateway
  namespace: showcase
  annotations:
    alb.networking.azure.io/alb-namespace: alb-showcase-system
    alb.networking.azure.io/alb-name: alb-showcase
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: __APP_HOSTNAME__
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: showcase-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: showcase-web
  namespace: showcase
spec:
  parentRefs:
    - name: showcase-gateway
      sectionName: https
  hostnames:
    - __APP_HOSTNAME__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: showcase-web
          port: 80
