services:
  api:
    build: ./src/Showcase.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports: ["5080:8080"]
    restart: unless-stopped

  web:
    build: ./src/Web
    ports: ["5173:8080"]
    depends_on: [api]

  care-portal:
    build: ./apps/care-portal/CarePortal.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports: ["5081:8080"]
    restart: unless-stopped

  community-hub:
    build: ./apps/community-hub/CommunityHub.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports: ["5082:8080"]
    restart: unless-stopped

  security-radar:
    build:
      context: ./apps/security-radar
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports: ["5083:8080"]
    restart: unless-stopped
