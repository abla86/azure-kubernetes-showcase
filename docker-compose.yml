services:
  care-portal:
    build:
      context: ./apps/care-portal/CarePortal.Api
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    networks: [showcase-net]
    restart: unless-stopped

  community-hub:
    build:
      context: ./apps/community-hub/CommunityHub.Api
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    networks: [showcase-net]
    restart: unless-stopped

  security-radar:
    build:
      context: ./apps/security-radar
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    networks: [showcase-net]
    restart: unless-stopped

networks:
  showcase-net:
    driver: bridge
