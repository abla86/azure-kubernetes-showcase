name: Terraform Plan and Apply via Azure OIDC

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose the Terraform operation"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_github_actions_client_id: ${{ secrets.AZURE_CLIENT_ID }}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'plan' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Terraform init for pull request validation
        if: github.event_name == 'pull_request'
        run: terraform init -backend=false -input=false

      - name: Terraform validate for pull request
        if: github.event_name == 'pull_request'
        run: terraform validate

      - name: Terraform init with Azure AD/OIDC backend
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=azure-kubernetes-showcase.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: github.event_name != 'pull_request'
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'pull_request'
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: infra/terraform/tfplan
          retention-days: 7

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
