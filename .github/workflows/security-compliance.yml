name: Security Compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "infra/bicep/**"
      - "k8s/**"
      - "scripts/validate_manifests.py"
      - "docs/iac-parity-matrix.md"
      - ".github/workflows/security-compliance.yml"

permissions:
  contents: read
  security-events: write

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail
          version=1.13.3
          curl -fsSL "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_amd64.zip" -o /tmp/terraform.zip
          curl -fsSL "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS" -o /tmp/terraform.SHA256SUMS
          grep "terraform_${version}_linux_amd64.zip" /tmp/terraform.SHA256SUMS | sed "s#  terraform_${version}_linux_amd64.zip#  /tmp/terraform.zip#" | sha256sum -c -
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  bicep:
    name: Bicep build validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Bicep
        shell: bash
        run: az bicep install
      - name: Bicep build
        shell: bash
        run: |
          set -euo pipefail
          find infra/bicep -name '*.bicep' -print0 | while IFS= read -r -d '' file; do
            az bicep build --file "$file" --stdout >/dev/null
          done

  manifest-policy:
    name: Kubernetes workload security policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate Kubernetes manifests
        run: python scripts/validate_manifests.py

  checkov:
    name: Check Terraform and Kubernetes security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes
          quiet: false
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

  kubeconform:
    name: Validate Kubernetes schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Kubernetes schemas
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -strict -ignore-missing-schemas -summary k8s

  parity:
    name: Check IaC parity contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify parity document and anchors
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/iac-parity-matrix.md
          test -d infra/terraform
          test -d infra/bicep
          grep -R 'oidc_issuer_enabled\|workload_identity_enabled' infra/terraform >/dev/null
          grep -R -i 'oidc\|workload identity' infra/bicep >/dev/null
          grep -R 'network_policy.*azure' infra/terraform >/dev/null
          grep -R -i 'network.*policy' infra/bicep >/dev/null
          grep -R 'admin_enabled.*false' infra/terraform >/dev/null
          echo 'IaC parity anchors present.'
