name: Sync npm lockfile

on:
  push:
    branches: [main]
    paths:
      - "src/Web/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-npm-lock
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile frontend lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reconcile package lock
        working-directory: src/Web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/Web/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Web/package-lock.json
          git commit -m "chore: synchronize frontend npm lockfile"
          git push
