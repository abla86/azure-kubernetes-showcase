name: Maintenance Log

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-log-main
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Update worklog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          date_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          commit=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          {
            echo "### $date_utc — $commit"
            echo "- Commit: $subject"
            echo "- Branch: main"
            echo ""
          } >> docs/worklog.md

      - name: Commit worklog if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/worklog.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update automated worklog"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to push automated worklog after retries."
          exit 1

      - name: Documentation sanity check
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CHANGELOG.md
          test -s docs/architecture-log.md
          test -s docs/worklog.md
