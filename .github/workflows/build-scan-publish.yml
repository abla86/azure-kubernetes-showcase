name: Build, Scan and Publish

on:
  push:
    branches: [main]
    paths: ["apps/**", "src/**", "docker-compose.yml", "k8s/**", "scripts/**", ".github/workflows/build-scan-publish.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/**", "src/**", "docker-compose.yml", "k8s/**", "scripts/**", ".github/workflows/build-scan-publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-scan:
    name: Build and scan verified image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: care-portal-api
            context: ./apps/care-portal/CarePortal.Api
          - name: community-hub-api
            context: ./apps/community-hub/CommunityHub.Api
          - name: showcase-api
            context: ./src/Showcase.Api
          - name: showcase-web
            context: ./src/Web
          - name: security-radar
            context: ./apps/security-radar
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          scan-type: image
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 30
      - name: Export scanned image
        if: ${{ success() && vars.ENABLE_AZURE_PUBLISH == 'true' }}
        run: docker save "${{ matrix.name }}:${{ github.sha }}" -o "image-${{ matrix.name }}.tar"
      - name: Upload scanned image
        if: ${{ success() && vars.ENABLE_AZURE_PUBLISH == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image-${{ matrix.name }}.tar
          retention-days: 1

  publish:
    name: Publish scanned images to Azure Container Registry
    runs-on: ubuntu-24.04
    needs: [build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_PUBLISH == 'true'
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [care-portal-api, community-hub-api, showcase-api, showcase-web, security-radar]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image
      - name: Load scanned image
        run: docker load -i "image/image-${{ matrix.name }}.tar"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Push scanned image
        run: |
          set -euo pipefail
          docker tag "${{ matrix.name }}:${{ github.sha }}" "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.name }}:${{ github.sha }}"
          docker tag "${{ matrix.name }}:${{ github.sha }}" "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.name }}:main"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.name }}:${{ github.sha }}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.name }}:main"

  kubernetes-render-check:
    name: Render and validate Kubernetes release manifests
    runs-on: ubuntu-24.04
    needs: [build-scan]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install manifest dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate Kubernetes source policy
        run: python scripts/validate_manifests.py
      - name: Verify required deployment placeholders
        shell: bash
        run: |
          set -euo pipefail
          grep -R -E '\$\{IMAGE_TAG\}|__APP_HOSTNAME__|__CERT_MANAGER_EMAIL__' k8s >/dev/null
          test -f k8s/kustomization.yaml

  kubernetes-deploy:
    name: Deploy release to AKS
    runs-on: ubuntu-24.04
    needs: [build-scan, kubernetes-render-check, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_DEPLOY == 'true'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      - uses: azure/setup-kubectl@v5
        with:
          version: latest
      - name: Render release manifests
        shell: pwsh
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
          CERT_MANAGER_EMAIL: ${{ vars.CERT_MANAGER_EMAIL }}
        run: |
          ./scripts/render-k8s.ps1 -ImageTag $env:IMAGE_TAG -AppHostname $env:APP_HOSTNAME -CertManagerEmail $env:CERT_MANAGER_EMAIL
      - name: Apply release manifests
        run: kubectl apply -k .rendered-k8s
      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl -n showcase rollout status deployment/showcase-api --timeout=180s
          kubectl -n showcase rollout status deployment/showcase-web --timeout=180s
          kubectl -n showcase rollout status deployment/care-portal-api --timeout=180s
          kubectl -n showcase rollout status deployment/community-hub-api --timeout=180s
          kubectl -n showcase rollout status deployment/security-radar --timeout=180s
