name: Controlled Chaos Test

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace
        required: true
        default: showcase
      deployment:
        description: Deployment to test
        required: true
        default: care-portal-api

permissions:
  contents: read
  id-token: write

jobs:
  chaos:
    name: Controlled pod resilience test
    runs-on: ubuntu-24.04
    environment: chaos-test
    steps:
      - uses: actions/checkout@v4
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" --name "${{ vars.AKS_CLUSTER_NAME }}" --overwrite-existing

      - name: Record healthy replicas
        run: kubectl -n "${{ inputs.namespace }}" rollout status deployment/"${{ inputs.deployment }}" --timeout=120s

      - name: Delete one pod
        run: |
          POD="$(kubectl -n "${{ inputs.namespace }}" get pods -l app="${{ inputs.deployment }}" -o jsonpath='{.items[0].metadata.name}')"
          test -n "$POD"
          kubectl -n "${{ inputs.namespace }}" delete pod "$POD" --wait=false

      - name: Verify recovery
        run: kubectl -n "${{ inputs.namespace }}" rollout status deployment/"${{ inputs.deployment }}" --timeout=120s
