name: CI-CD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "tools/**"
      - "k8s/**"
      - "security/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "Makefile"
      - "infra/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "tools/**"
      - "k8s/**"
      - "security/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "Makefile"
      - "infra/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Python operations tools
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Python regression tests
        run: python -m unittest discover -s tests/python-tools -p 'test_*.py' -v

  backend:
    name: Backend build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: Test without rebuilding
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - name: Refresh lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - name: Refresh lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  kubernetes:
    name: Kubernetes manifest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@v5
        with:
          version: latest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install manifest dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Render Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl kustomize k8s/ > rendered-k8s.yaml
          test -s rendered-k8s.yaml
          grep -q '^apiVersion:' rendered-k8s.yaml
      - name: Validate workload security policy
        run: python scripts/validate_manifests.py

  azure-iac:
    name: Azure IaC validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep version >/dev/null 2>&1 || az bicep install
          while IFS= read -r -d '' file; do
            az bicep build --file "$file" --stdout >/dev/null
          done < <(find infra/bicep -name '*.bicep' -print0)
      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail
          version=1.13.3
          curl -fsSL "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_amd64.zip" -o /tmp/terraform.zip
          echo "$(curl -fsSL "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS" | grep "terraform_${version}_linux_amd64.zip" | awk '{print $1}')  /tmp/terraform.zip" | sha256sum -c -
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  docker:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build main API
        run: docker build -t azure-kubernetes-showcase-api:${{ github.sha }} ./src/Showcase.Api
      - name: Build frontend
        run: docker build -t azure-kubernetes-showcase-web:${{ github.sha }} ./src/Web
      - name: Build care portal
        run: docker build -t care-portal-api:${{ github.sha }} ./apps/care-portal/CarePortal.Api
      - name: Build community hub
        run: docker build -t community-hub-api:${{ github.sha }} ./apps/community-hub/CommunityHub.Api
      - name: Build security radar
        run: docker build -t security-radar:${{ github.sha }} ./apps/security-radar

  security:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript
          queries: security-extended
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - uses: github/codeql-action/analyze@v4

  resilience-self-test:
    name: Non-destructive local resilience and security self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [docker]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Set local telemetry mode
        run: echo "OTEL_ENABLED=false" >> "$GITHUB_ENV"
      - name: Run canonical local smoke test
        run: python scripts/local_smoke_test.py --dry-run
