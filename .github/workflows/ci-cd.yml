name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  kubernetes:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - run: kubectl apply --dry-run=client --validate=false -f k8s/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate workload security policy
        run: python scripts/validate_manifests.py

  azure-iac:
    name: Azure IaC validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            while IFS= read -r -d '' file; do
              az bicep build --file "$file" --stdout >/dev/null
            done < <(find infra/bicep -name '*.bicep' -print0)
      - name: Validate Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build main API
        run: docker build -t azure-kubernetes-showcase-api:${{ github.sha }} ./src/Showcase.Api
      - name: Build frontend
        run: docker build -t azure-kubernetes-showcase-web:${{ github.sha }} ./src/Web
      - name: Build care portal
        run: docker build -t care-portal-api:${{ github.sha }} ./apps/care-portal/CarePortal.Api
      - name: Build community hub
        run: docker build -t community-hub-api:${{ github.sha }} ./apps/community-hub/CommunityHub.Api
      - name: Build security radar
        run: docker build -t security-radar:${{ github.sha }} ./apps/security-radar

  security:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript-typescript
          queries: security-extended
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - uses: github/codeql-action/analyze@v3

  resilience-self-test:
    name: Non-destructive local resilience and security self-test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Start local ecosystem
        run: docker compose up --build -d
      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            http://127.0.0.1:5001/health \
            http://127.0.0.1:5002/health \
            http://127.0.0.1:5080/health; do
            healthy=0
            for i in {1..30}; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done
            test "$healthy" -eq 1
          done
      - name: Run API self-test
        run: python scripts/api_fuzzer.py
      - name: Verify deception endpoint contract
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w "%{http_code}" \
            -X POST http://127.0.0.1:5080/api/simulate-attack)
          test "$status" = "400"
          grep -q '"detected":true' "$body"
          grep -q '"simulation":true' "$body"
      - name: Verify ghost route contract
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w "%{http_code}" \
            http://127.0.0.1:5080/ghost/admin)
          test "$status" = "404"
          grep -q '"detected":true' "$body"
          grep -q '"deception":true' "$body"
      - name: Verify security event feed
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS http://127.0.0.1:5080/api/events)
          printf '%s' "$body" | grep -q 'ghost-route-rejected'
      - name: Teardown
        if: always()
        run: docker compose down -v
