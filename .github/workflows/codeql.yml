name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  csharp:
    name: CodeQL C#
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended
      - name: Autobuild C#
        uses: github/codeql-action/autobuild@v4
      - name: Analyze and upload C# results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          upload: always

  javascript:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze and upload JavaScript/TypeScript results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: always
