name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  csharp:
    name: CodeQL C#
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore AzureKubernetesShowcase.slnx
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended
      - name: Build solution for CodeQL
        run: dotnet build AzureKubernetesShowcase.slnx --configuration Release --no-restore
      - name: Analyze and upload C# results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          upload: always

  javascript:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze and upload JavaScript/TypeScript results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: always
